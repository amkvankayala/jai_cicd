[project]
name = "stock-insights"
version = "0.1.0"
description = "FastAPI and Streamlit stock research application"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "openai>=1.54,<2.0",
  "pandas>=2.2,<3.0",
  "python-dotenv>=1.0,<2.0",
  "streamlit>=1.39,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
  "yfinance>=0.2.50,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
